<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gold Metallic 3D Gradient for Spade -->
    <linearGradient id="goldSpadeGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="25%" stop-color="#F5D061" />
      <stop offset="55%" stop-color="#E6AF2E" />
      <stop offset="85%" stop-color="#9C6B14" />
      <stop offset="100%" stop-color="#F5D061" />
    </linearGradient>

    <!-- Gold Border Ring Gradient -->
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061" />
      <stop offset="50%" stop-color="#8C5D0E" />
      <stop offset="100%" stop-color="#F5D061" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Dark Casino Matte Squircle Base -->
  <rect width="512" height="512" rx="120" fill="#0B0B0F" />
  
  <!-- Subtle Inner Background Gradient -->
  <rect width="512" height="512" rx="120" fill="radial-gradient(circle at 50% 30%, rgba(245, 208, 97, 0.15), transparent 70%)" />

  <!-- Luxury Outer Gold Border -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="none" stroke="url(#goldBorderGrad)" stroke-width="16" stroke-opacity="0.85" />
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="rgba(245, 208, 97, 0.15)" stroke-width="4" />

  <!-- Spade Emblem Group with Drop Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Spade Head & Body -->
    <path
      d="M256 96 C216 168 120 224 120 296 C120 354 164 392 222 376 C238 371 249 360 256 348 C263 360 274 371 290 376 C348 392 392 354 392 296 C392 224 296 168 256 96 Z"
      fill="url(#goldSpadeGrad)"
    />

    <!-- Spade Stem / Pedestal -->
    <path
      d="M236 340 L212 416 L300 416 L276 340 Z"
      fill="url(#goldSpadeGrad)"
    />
  </g>

  <!-- Sparkle Accent in Top Right -->
  <g transform="translate(370, 110)">
    <path
      d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z"
      fill="#FFF9D2"
      filter="url(#goldGlow)"
    />
  </g>
</svg>
